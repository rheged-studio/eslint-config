version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Group all action bumps into a single PR per week. Keeps notification
    # noise low and ensures SHA-pinned `uses:` lines stay current across
    # ci.yml + pkg-release.yml + shared-workflows callers. Grouped PRs land or revert atomically.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # `patterns: ["*"]` groups every npm dependency — production and
    # development alike — into a single PR per week, so one lockfile churn
    # lands or reverts atomically instead of racing across parallel PRs.
    groups:
      npm:
        patterns: ["*"]
    # Held majors. Each one breaks the grouped PR or this package's ESLint 9
    # support, so the group would go red every week. Minor and patch updates
    # keep flowing. Remove an entry once its "lift when" condition is met.
    ignore:
      # Lift when typescript-eslint supports TypeScript 7 (it peers
      # `typescript <6.1.0` and throws on load under 7):
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Lift with R-2782 (ESLint 10 support): eslint-plugin-astro 2+ peers
      # `eslint >=10`. Plugin 1.x depends on astro-eslint-parser ^1, so the
      # direct parser dependency stays on the same major.
      - dependency-name: "eslint-plugin-astro"
        versions: [">=2"]
      - dependency-name: "astro-eslint-parser"
        versions: [">=2"]
      # Lift with R-2782: eslint-plugin-unicorn 66+ peers `eslint >=10.4`.
      - dependency-name: "eslint-plugin-unicorn"
        versions: [">=66"]
    # `chore` (not `ci`) so subjects read `chore(deps): …` / `chore(deps-dev): …`
    # — Conventional, and a no-release type under the release-please bump rules,
    # so a dependency bump never cuts a version on its own. Both prefixes are
    # set explicitly: `prefix` alone leaves development-dependency bumps on
    # Dependabot's own default. See R-980 / R-823.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
